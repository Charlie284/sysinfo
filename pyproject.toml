[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sysinfo-cli"
version = "0.1.0"
description = "Cross-platform CLI that prints concise system information"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charlie Harper" }]
dependencies = ["psutil>=5.9,<8"]

[project.scripts]
sysinfo = "sysinfo:main"

[project.urls]
Repository = "https://github.com/Charlie284/sysinfo"
Issues = "https://github.com/Charlie284/sysinfo/issues"

[tool.setuptools]
py-modules = ["sysinfo"]

[tool.ruff]
target-version = "py39"
